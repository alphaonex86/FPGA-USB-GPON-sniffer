# FT2232H EEPROM of the in-line sniffer (93LC56B): channel A asynchronous 245 FIFO on a tty (ftdi_sio), channel B left
# to openFPGALoader (MPSSE is selected by software). Write it before the first bitstream: with a blank EEPROM channel A
# is a UART.   ftdi_eeprom --flash-eeprom usb/ft2232h.conf
vendor_id=0x0403
product_id=0x6010
manufacturer="CatchChallenger"
product="GPON in-line sniffer"
serial="0001"
use_serial=true
max_power=500
self_powered=false
remote_wakeup=false
eeprom_type=0x56
cha_type=FIFO
cha_vcp=true
chb_type=UART
chb_vcp=false
filename="ft2232h.bin"
